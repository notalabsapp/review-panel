<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Review</title>
<style>
  /* 色の約束: 公開する=緑(左) / 公開しない=赤(右) / カテゴリ・★の選択=青 */
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1f; --mute:#6b6b70; --line:#e3e3e0; --accent:#1f5fbf; --accent-ink:#fff; --go:#1e8e4e; --go-soft:#e8f5ee; --no:#c62828; --no-soft:#fdeceb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 120px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  h1 { font-size:17px; line-height:1.45; margin:0 0 6px; }
  .meta { color:var(--mute); font-size:13px; }
  /* 画像: パッケージ → サンプルを同じ大きさで縦に積む。画面幅いっぱい・切り抜きなし (拡大タップ不要) */
  .gallery { margin: 12px -14px 0; }
  .gallery img { display:block; width:100%; height:auto; background:#e9e9e6; margin:0 0 6px; min-height:120px; }
  .gallery .cap { font-size:12px; color:var(--mute); padding:2px 14px 10px; }
  h2 { font-size:14px; margin:0 0 10px; color:var(--mute); font-weight:600; letter-spacing:.02em; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  button.opt { flex: 1 1 calc(50% - 8px); min-height:52px; font-size:16px; border-radius:12px; border:2px solid var(--line); background:#fff; color:var(--ink); }
  button.opt.stars { flex: 1 1 calc(33% - 8px); font-size:19px; letter-spacing:.05em; }
  button.opt[aria-pressed="true"] { border-color:var(--accent); background:var(--accent); color:var(--accent-ink); font-weight:700; }
  /* 処理ボタン: 左=公開する(緑) / 右=公開しない(赤)。未選択でも色で区別できるよう枠と地を色付き、選択で塗りつぶし */
  #actions { flex-wrap:nowrap; }
  button.act { flex:1 1 50%; min-height:72px; font-size:18px; font-weight:700; border-width:3px; border-radius:14px; }
  button.act-post { border-color:var(--go); background:var(--go-soft); color:var(--go); }
  button.act-skip { border-color:var(--no); background:var(--no-soft); color:var(--no); }
  button.act-post[aria-pressed="true"] { background:var(--go); border-color:var(--go); color:#fff; }
  button.act-skip[aria-pressed="true"] { background:var(--no); border-color:var(--no); color:#fff; }
  button.act[aria-pressed="false"].dim { opacity:.45; }
  .hint { font-size:12px; color:var(--mute); margin-top:8px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.96); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .bar-inner { max-width:560px; margin:0 auto; display:flex; gap:8px; align-items:center; }
  #send { flex:1; min-height:60px; border:0; border-radius:14px; background:var(--go); color:#fff; font-size:18px; font-weight:700; }
  #send.skip { background:var(--no); }
  #send:disabled { background:#c9c9c9; }
  #status { font-size:13px; color:var(--mute); min-width: 0; }
  .err { background:#fff4f4; border-color:#f1c7c7; color:#8a1f1f; }
  pre#preview { white-space:pre-wrap; word-break:break-all; font-size:12px; color:var(--mute); margin:8px 0 0; }
  button.link { background:none; border:0; color:var(--mute); text-decoration:underline; font-size:13px; padding:4px 0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div id="error" class="card err" hidden></div>

  <section id="app" hidden>
    <div class="card">
      <h1 id="title"></h1>
      <div class="meta"><span id="performers"></span> <span id="cid"></span></div>
      <div class="meta" id="expiry"></div>
      <div id="gallery" class="gallery"></div>
    </div>

    <div class="card">
      <h2>処理</h2>
      <div class="row" id="actions"></div>
    </div>

    <div id="detail">
      <div class="card" id="catCard">
        <h2>カテゴリ（複数可）</h2>
        <div class="row" id="cats"></div>
        <div class="hint" id="catHint"></div>
      </div>
      <div class="card" id="densityCard">
        <h2>密度</h2>
        <div class="row" id="density"></div>
      </div>
      <div class="card" id="rangeCard">
        <h2>範囲</h2>
        <div class="row" id="range"></div>
      </div>
    </div>

    <div class="card">
      <h2>送信内容</h2>
      <pre id="preview"></pre>
      <button class="link" id="copy" type="button">本文をコピー（メールアプリが開かない場合）</button>
    </div>
  </section>
</main>

<div class="bar" id="bar" hidden>
  <div class="bar-inner">
    <button id="send" type="button" disabled>メールを作成</button>
  </div>
  <div class="bar-inner"><span id="status"></span></div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  function fail(msg) {
    var e = $("error"); e.textContent = msg; e.hidden = false;
  }

  function decodePayload() {
    var m = location.hash.match(/(?:^#|&)d=([A-Za-z0-9_-]+)/);
    if (!m) return null;
    var b64 = m[1].replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }

  var p;
  try { p = decodePayload(); } catch (e) { p = null; }
  if (!p || p.v !== 1 || !p.id || !p.tk || !p.to || !p.su) {
    fail("リンクが正しくありません。依頼メールのリンクをもう一度開いてください。");
    return;
  }

  var expired = Date.now() > Date.parse(p.ex);
  var isManga = p.ty === "manga";
  var state = { action: null, cats: [], density: null, range: null };

  $("title").textContent = p.ti || p.id;
  $("performers").textContent = p.pe || "";
  $("cid").textContent = "（" + p.id + "）";
  $("expiry").textContent = expired ? "このリンクは期限切れです" : "有効期限: " + new Date(p.ex).toLocaleString("ja-JP");
  // パッケージ → サンプルの順に、全部同じ幅 (画面いっぱい) で縦に並べる
  var pics = [];
  if (p.th && /^https:\/\//.test(p.th)) pics.push(p.th);
  (p.sa || []).forEach(function (u) { if (/^https:\/\//.test(u)) pics.push(u); });
  pics.forEach(function (u, i) {
    var img = document.createElement("img");
    img.decoding = "async"; img.referrerPolicy = "no-referrer"; img.alt = "";
    if (i > 1) img.loading = "lazy";   // 先頭2枚はすぐ読む。以降はスクロールに合わせて
    img.src = u;
    $("gallery").appendChild(img);
  });
  if (pics.length) {
    var cap = document.createElement("div"); cap.className = "cap";
    cap.textContent = "画像 " + pics.length + " 枚（パッケージ + サンプル " + (pics.length - (p.th ? 1 : 0)) + "）";
    $("gallery").appendChild(cap);
  }

  function optButton(label, extraClass, onTap) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt" + (extraClass ? " " + extraClass : "");
    b.textContent = label; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", onTap);
    return b;
  }
  function paint(container, isOn) {
    Array.prototype.forEach.call(container.children, function (b) { b.setAttribute("aria-pressed", isOn(b.dataset.v) ? "true" : "false"); });
  }

  // 処理ボタン: 値は常に「投稿」「スキップ」(スキップ = ボツ = 公開しない)。表示名はリンクのデータから
  var labels = (p.al && p.al.post && p.al.skip) ? p.al : { post: "投稿", skip: "ボツ（公開しない）" };
  // 並びと色は固定: 左=投稿(公開する・緑) / 右=スキップ(ボツ・公開しない・赤)
  [["投稿", labels.post, "act act-post"], ["スキップ", labels.skip, "act act-skip"]].forEach(function (t) {
    var b = optButton(t[1], "", function () { state.action = t[0]; render(); });
    b.className = "opt " + t[2];
    b.dataset.v = t[0]; $("actions").appendChild(b);
  });

  var choices = isManga ? [p.ex1] : (p.ca || []).filter(function (c) { return c !== p.ex1; });
  if (isManga) { state.cats = [p.ex1]; }
  choices.forEach(function (c) {
    var b = optButton(c, "", function () {
      if (isManga) return;
      var i = state.cats.indexOf(c);
      if (i >= 0) state.cats.splice(i, 1); else state.cats.push(c);
      render();
    });
    b.dataset.v = c; $("cats").appendChild(b);
  });

  ["★", "★★", "★★★"].forEach(function (s) {
    var d = optButton(s, "stars", function () { state.density = s; render(); }); d.dataset.v = s; $("density").appendChild(d);
    var r = optButton(s, "stars", function () { state.range = s; render(); }); r.dataset.v = s; $("range").appendChild(r);
  });

  function bodyText() {
    var lines = ["処理：" + (state.action || "")];
    if (state.action === "投稿" && !isManga) {
      lines.push("カテゴリ：" + state.cats.join(", "));
      lines.push("密度：" + (state.density || ""));
      lines.push("範囲：" + (state.range || ""));
    }
    lines.push("", p.tk, "（作品ID: " + p.id + "）");
    return lines.join("\n");
  }

  function ready() {
    if (expired || !state.action) return false;
    if (state.action === "スキップ" || isManga) return true;
    return state.cats.length > 0 && !!state.density && !!state.range;
  }

  function render() {
    paint($("actions"), function (v) { return v === state.action; });
    Array.prototype.forEach.call($("actions").children, function (b) { b.classList.toggle("dim", !!state.action && b.dataset.v !== state.action); });
    paint($("cats"), function (v) { return state.cats.indexOf(v) >= 0; });
    paint($("density"), function (v) { return v === state.density; });
    paint($("range"), function (v) { return v === state.range; });
    // 漫画: 処理の2択だけ (カテゴリは自動で固定・密度/範囲なし)。動画: 投稿を選んだ時だけカテゴリ/密度/範囲
    var needDetail = state.action === "投稿" && !isManga;
    $("densityCard").hidden = !needDetail; $("rangeCard").hidden = !needDetail;
    $("catCard").hidden = !needDetail;
    $("preview").textContent = bodyText();
    $("send").disabled = !ready();
    $("send").classList.toggle("skip", state.action === "スキップ");
    $("send").textContent = state.action === "スキップ" ? "ボツでメールを作成" : "メールを作成";
    var note = state.action === "スキップ" ? "（公開しません）" : "";
    $("status").textContent = expired ? "期限切れのため送信できません" : (ready() ? "メールアプリが開きます。そのまま送信してください" + note : "選択してください");
  }

  function mailtoHref() {
    return "mailto:" + encodeURIComponent(p.to) +
      "?subject=" + encodeURIComponent(p.su) +
      "&body=" + encodeURIComponent(bodyText());
  }

  $("send").addEventListener("click", function () {
    if (!ready()) return;
    location.href = mailtoHref();
  });
  $("copy").addEventListener("click", function () {
    var t = "宛先: " + p.to + "\n件名: " + p.su + "\n\n" + bodyText();
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { $("status").textContent = "コピーしました"; });
  });

  $("app").hidden = false; $("bar").hidden = false;
  render();
})();
</script>
</body>
</html>
