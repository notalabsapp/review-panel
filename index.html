<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://*.workers.dev; base-uri 'none'; form-action 'none'">
<title>Review</title>
<style>
  /* 色の約束: 公開する=緑(左) / 公開しない=赤(右) / カテゴリ・★の選択=青 */
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1f; --mute:#6b6b70; --line:#e3e3e0; --accent:#1f5fbf; --accent-ink:#fff; --go:#1e8e4e; --go-soft:#e8f5ee; --no:#c62828; --no-soft:#fdeceb; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 140px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
  h1 { font-size:17px; line-height:1.45; margin:0 0 6px; }
  .meta { color:var(--mute); font-size:13px; }
  /* 画像: パッケージ → サンプルを同じ大きさで縦に積む。画面幅いっぱい・切り抜きなし (拡大タップ不要) */
  .gallery { margin: 0 -14px 12px; }   /* main の左右余白を打ち消して画面の端から端まで */
  .gallery img { display:block; width:100%; height:auto; background:#e9e9e6; margin:0 0 6px; min-height:120px; }
  .gallery .cap { font-size:12px; color:var(--mute); padding:2px 14px 10px; }
  h2 { font-size:14px; margin:0 0 10px; color:var(--mute); font-weight:600; letter-spacing:.02em; }
  .row { display:flex; flex-wrap:wrap; gap:8px; }
  button.opt { flex: 1 1 calc(50% - 8px); min-height:52px; font-size:16px; border-radius:12px; border:2px solid var(--line); background:#fff; color:var(--ink); }
  button.opt.stars { flex: 1 1 calc(33% - 8px); font-size:19px; letter-spacing:.05em; }
  button.opt[aria-pressed="true"] { border-color:var(--accent); background:var(--accent); color:var(--accent-ink); font-weight:700; }
  /* 処理ボタン: 左=公開する(緑) / 右=公開しない(赤)。未選択でも色で区別できるよう枠と地を色付き、選択で塗りつぶし */
  #actions { flex-wrap:nowrap; }
  button.act { flex:1 1 50%; min-height:72px; font-size:18px; font-weight:700; border-width:3px; border-radius:14px; }
  button.act-post { border-color:var(--go); background:var(--go-soft); color:var(--go); }
  button.act-skip { border-color:var(--no); background:var(--no-soft); color:var(--no); }
  button.act-post[aria-pressed="true"] { background:var(--go); border-color:var(--go); color:#fff; }
  button.act-skip[aria-pressed="true"] { background:var(--no); border-color:var(--no); color:#fff; }
  button.act[aria-pressed="false"].dim { opacity:.45; }
  .hint { font-size:12px; color:var(--mute); margin-top:8px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.96); border-top:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .bar-inner { max-width:560px; margin:0 auto; display:flex; gap:8px; align-items:center; }
  #send { flex:1; min-height:60px; border:0; border-radius:14px; background:var(--go); color:#fff; font-size:18px; font-weight:700; }
  #send.skip { background:var(--no); }
  #send:disabled { background:#c9c9c9; }
  #later { flex:0 0 auto; min-height:60px; padding:0 14px; border:2px solid var(--line); border-radius:14px; background:#fff; color:var(--mute); font-size:14px; }
  #status { font-size:13px; color:var(--mute); min-width: 0; }
  /* 児童安全の注意 (2026-09-24): 自動フィルタは通ったが要注意の語がある作品 */
  .warn { background:var(--no-soft); border:2px solid var(--no); color:var(--no); font-weight:700; }
  .warn ul { margin:6px 0 0; padding-left:20px; font-weight:400; }
  .err { background:#fff4f4; border-color:#f1c7c7; color:#8a1f1f; }
  pre#preview { white-space:pre-wrap; word-break:break-all; font-size:12px; color:var(--mute); margin:8px 0 0; }
  button.link { background:none; border:0; color:var(--mute); text-decoration:underline; font-size:13px; padding:4px 0; }
  /* 判定待ち一覧 (2026-11) */
  .qhead { display:flex; align-items:center; gap:8px; }
  .qhead .count { flex:1; font-weight:700; }
  .qhead button { min-height:40px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); font-size:14px; }
  .qlist { list-style:none; margin:10px 0 0; padding:0; }
  .qlist li { display:flex; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--line); cursor:pointer; }
  .qlist li.cur { background:#eef3fb; margin:0 -14px; padding:8px 14px; }
  .qlist img { width:56px; height:40px; object-fit:cover; border-radius:6px; background:#e9e9e6; flex:0 0 auto; }
  .qlist .t { font-size:13px; line-height:1.4; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .toast { background:var(--go-soft); border-color:var(--go); color:var(--go); font-weight:700; }
  .toast.skip { background:var(--no-soft); border-color:var(--no); color:var(--no); }
  .empty { text-align:center; padding:28px 14px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div id="error" class="card err" hidden></div>

  <!-- 判定待ち一覧 (ブックマーク URL #k=... で開いたときだけ) -->
  <section id="queue" hidden>
    <div class="card">
      <div class="qhead">
        <span class="count" id="qcount"></span>
        <button type="button" id="qtoggle">一覧</button>
        <button type="button" id="qreload">更新</button>
      </div>
      <ul class="qlist" id="qlist" hidden></ul>
    </div>
    <div class="card toast" id="toast" hidden></div>
    <div class="card empty" id="qempty" hidden>
      <div style="font-weight:700;margin-bottom:6px">判定待ちはありません</div>
      <div class="meta">新しい作品は自動で補充されます（10分ごと）。あとで「更新」を押してください。</div>
    </div>
  </section>

  <section id="app" hidden>
    <div class="card">
      <h1 id="title"></h1>
      <div class="meta"><span id="performers"></span> <span id="cid"></span></div>
      <div class="meta" id="expiry"></div>
    </div>
    <div class="card warn" id="warn" hidden></div>
    <div class="card" id="evidence" hidden></div>
    <div id="gallery" class="gallery"></div>

    <div class="card">
      <h2>処理</h2>
      <div class="row" id="actions"></div>
    </div>

    <div id="detail">
      <div class="card" id="catCard">
        <h2>カテゴリ（複数可）</h2>
        <div class="row" id="cats"></div>
        <div class="hint" id="catHint"></div>
      </div>
      <div class="card" id="densityCard">
        <h2>密度</h2>
        <div class="row" id="density"></div>
      </div>
      <div class="card" id="rangeCard">
        <h2>範囲</h2>
        <div class="row" id="range"></div>
      </div>
    </div>

    <div class="card" id="previewCard">
      <h2>送信内容</h2>
      <pre id="preview"></pre>
      <button class="link" id="copy" type="button">本文をコピー（メールアプリが開かない場合）</button>
    </div>
  </section>
</main>

<div class="bar" id="bar" hidden>
  <div class="bar-inner">
    <button id="later" type="button" hidden>あとで</button>
    <button id="send" type="button" disabled>メールを作成</button>
  </div>
  <div class="bar-inner"><span id="status"></span></div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };

  function fail(msg) {
    var e = $("error"); e.textContent = msg; e.hidden = false;
  }
  function hashParam(name) {
    var m = location.hash.match(new RegExp("(?:^#|&)" + name + "=([^&]+)"));
    return m ? decodeURIComponent(m[1]) : null;
  }
  function decodePayload() {
    var d = hashParam("d");
    if (!d || !/^[A-Za-z0-9_-]+$/.test(d)) return null;
    var b64 = d.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  // ---------- 1件の表示と判定 (旧リンク #d= / 一覧の両方で使う) ----------
  var p = null;               // 表示中の作品データ
  var inbox = null;           // 判定の送り先 (受け口)。無ければ mailto 方式 (旧リンクの互換)
  var queueMode = false;
  var state, expired, isManga, sending = false, sent = false;
  var onSent = null;          // 一覧モード: 送信できたら次へ

  function optButton(label, extraClass, onTap) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "opt" + (extraClass ? " " + extraClass : "");
    b.textContent = label; b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", onTap);
    return b;
  }
  function paint(container, isOn) {
    Array.prototype.forEach.call(container.children, function (b) { b.setAttribute("aria-pressed", isOn(b.dataset.v) ? "true" : "false"); });
  }

  function showItem(item) {
    p = item;
    state = { action: null, cats: [], density: null, range: null, auto: [] };
    sending = false; sent = false;
    expired = Date.now() > Date.parse(p.ex);
    isManga = p.ty === "manga";
    ["warn", "evidence", "gallery", "actions", "cats", "density", "range"].forEach(function (id) { clear($(id)); });
    $("warn").hidden = true; $("evidence").hidden = true;
    $("send").style.background = "";
    Array.prototype.forEach.call(document.querySelectorAll("button.opt"), function (b) { b.disabled = false; });

    $("title").textContent = p.ti || p.id;
    $("performers").textContent = p.pe || "";
    $("cid").textContent = "（" + p.id + "）";
    if (p.wa && p.wa.length) {
      var w = $("warn");
      w.textContent = "⚠ 要注意: 未成年に見えないか必ず確認。少しでも迷ったら「公開しない」";
      var ul = document.createElement("ul");
      p.wa.forEach(function (s) { var li = document.createElement("li"); li.textContent = s; ul.appendChild(li); });
      w.appendChild(ul);
      w.hidden = false;
    }
    // 体毛の根拠 (2026-09-26: hairy-pedia の体毛評価 / タイトルの語 等)。古いリンクには無い
    if ((p.ev && p.ev.length) || p.hr) {
      var ev = $("evidence");
      var h = document.createElement("h2"); h.textContent = "体毛の根拠"; ev.appendChild(h);
      var eul = document.createElement("ul");
      (p.ev || []).forEach(function (s) { var li = document.createElement("li"); li.textContent = s; eul.appendChild(li); });
      ev.appendChild(eul);
      if (p.hr && /^https:\/\/hairy-pedia\.com\//.test(p.hr)) {
        var a = document.createElement("a"); a.href = p.hr; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.textContent = "hairy-pedia の記事を開く"; ev.appendChild(a);
      }
      ev.hidden = false;
    }
    $("expiry").textContent = expired ? "このリンクは期限切れです" : (queueMode ? "" : "有効期限: " + new Date(p.ex).toLocaleString("ja-JP"));
    // パッケージ → サンプルの順に、全部同じ幅 (画面いっぱい) で縦に並べる
    var pics = [];
    if (p.th && /^https:\/\//.test(p.th)) pics.push(p.th);
    (p.sa || []).forEach(function (u) { if (/^https:\/\//.test(u)) pics.push(u); });
    pics.forEach(function (u, i) {
      var img = document.createElement("img");
      img.decoding = "async"; img.referrerPolicy = "no-referrer"; img.alt = "";
      if (i > 1) img.loading = "lazy";   // 先頭2枚はすぐ読む。以降はスクロールに合わせて
      img.src = u;
      $("gallery").appendChild(img);
    });
    if (pics.length) {
      var cap = document.createElement("div"); cap.className = "cap";
      cap.textContent = "画像 " + pics.length + " 枚（パッケージ + サンプル " + (pics.length - (p.th ? 1 : 0)) + "）";
      $("gallery").appendChild(cap);
    }

    // 処理ボタン: 値は常に「投稿」「スキップ」(スキップ = ボツ = 公開しない)。表示名はデータから
    var labels = (p.al && p.al.post && p.al.skip) ? p.al : { post: "投稿", skip: "ボツ（公開しない）" };
    // 並びと色は固定: 左=投稿(公開する・緑) / 右=スキップ(ボツ・公開しない・赤)
    [["投稿", labels.post, "act act-post"], ["スキップ", labels.skip, "act act-skip"]].forEach(function (t) {
      var b = optButton(t[1], "", function () { state.action = t[0]; render(); });
      b.className = "opt " + t[2];
      b.dataset.v = t[0]; $("actions").appendChild(b);
    });

    var choices = isManga ? [p.ex1] : (p.ca || []).filter(function (c) { return c !== p.ex1; });
    if (isManga) { state.cats = [p.ex1]; }
    // 2026-11-10 オーナーGO: 「超剛毛AV」を選ぶと「剛毛AV」「ケツ毛AV」(= ケツ毛あり) も自動で ON (既定 ON・手で外せる)。
    //   自動で付けた分だけ覚えておき、超剛毛AV を外したら、まだ付いている自動分を戻す (手で付けた分・先に付いていた分は残す)
    var SUPER = "超剛毛AV", AUTO_WITH_SUPER = ["剛毛AV", "ケツ毛AV"];
    choices.forEach(function (c) {
      var b = optButton(c, "", function () {
        if (isManga) return;
        var i = state.cats.indexOf(c);
        if (i >= 0) {
          state.cats.splice(i, 1);
          if (c === SUPER) {
            state.auto.forEach(function (a) { var k = state.cats.indexOf(a); if (k >= 0) state.cats.splice(k, 1); });
            state.auto = [];
          } else {
            state.auto = state.auto.filter(function (a) { return a !== c; }); // 手で外した自動分は以後追わない
          }
        } else {
          state.cats.push(c);
          if (c === SUPER) {
            AUTO_WITH_SUPER.forEach(function (a) {
              if (choices.indexOf(a) >= 0 && state.cats.indexOf(a) < 0) { state.cats.push(a); state.auto.push(a); }
            });
          } else {
            state.auto = state.auto.filter(function (a) { return a !== c; }); // 手で付け直したものは手の分
          }
        }
        render();
      });
      b.dataset.v = c; $("cats").appendChild(b);
    });

    ["★", "★★", "★★★"].forEach(function (s) {
      var d = optButton(s, "stars", function () { state.density = s; render(); }); d.dataset.v = s; $("density").appendChild(d);
      var r = optButton(s, "stars", function () { state.range = s; render(); }); r.dataset.v = s; $("range").appendChild(r);
    });

    $("copy").hidden = !!inbox;
    $("previewCard").hidden = queueMode;
    $("app").hidden = false; $("bar").hidden = false;
    render();
  }

  function bodyText() {
    var lines = ["処理：" + (state.action || "")];
    if (state.action === "投稿" && !isManga) {
      lines.push("カテゴリ：" + state.cats.join(", "));
      lines.push("密度：" + (state.density || ""));
      lines.push("範囲：" + (state.range || ""));
    }
    lines.push("", p.tk, "（作品ID: " + p.id + "）");
    return lines.join("\n");
  }

  function ready() {
    if (expired || !state.action) return false;
    if (state.action === "スキップ" || isManga) return true;
    return state.cats.length > 0 && !!state.density && !!state.range;
  }

  function render() {
    paint($("actions"), function (v) { return v === state.action; });
    Array.prototype.forEach.call($("actions").children, function (b) { b.classList.toggle("dim", !!state.action && b.dataset.v !== state.action); });
    paint($("cats"), function (v) { return state.cats.indexOf(v) >= 0; });
    paint($("density"), function (v) { return v === state.density; });
    paint($("range"), function (v) { return v === state.range; });
    // 漫画: 処理の2択だけ (カテゴリは自動で固定・密度/範囲なし)。動画: 投稿を選んだ時だけカテゴリ/密度/範囲
    var needDetail = state.action === "投稿" && !isManga;
    $("densityCard").hidden = !needDetail; $("rangeCard").hidden = !needDetail;
    $("catCard").hidden = !needDetail;
    $("preview").textContent = bodyText();
    if (sent) return;
    $("send").disabled = !ready() || sending;
    $("send").classList.toggle("skip", state.action === "スキップ");
    var verb = inbox ? "送信" : "メールを作成";
    $("send").textContent = state.action === "スキップ" ? "ボツで" + verb : verb;
    var note = state.action === "スキップ" ? "（公開しません）" : "";
    var readyMsg = inbox ? (queueMode ? "押すと送信して次の作品へ進みます" : "押すとそのまま送信されます") : "メールアプリが開きます。そのまま送信してください";
    $("status").textContent = expired ? "期限切れのため送信できません" : (ready() ? readyMsg + note : "選択してください");
  }

  function mailtoHref() {
    return "mailto:" + encodeURIComponent(p.to) +
      "?subject=" + encodeURIComponent(p.su) +
      "&body=" + encodeURIComponent(bodyText());
  }

  function lockAll(msg, color) {
    sent = true;
    Array.prototype.forEach.call(document.querySelectorAll("button.opt"), function (b) { b.disabled = true; });
    $("send").disabled = true; $("send").textContent = msg; $("send").style.background = color;
    $("copy").hidden = true;
  }
  function postDecision() {
    sending = true; render();
    $("status").textContent = "送信中…";
    var decision = { action: state.action, type: isManga ? "manga" : "video" };
    if (state.action === "投稿" && !isManga) { decision.categories = state.cats.slice(); decision.density = state.density; decision.range = state.range; }
    var item = p, action = state.action;
    fetch(inbox + "/v1/judge", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ token: p.tk, decision: decision }), credentials: "omit", referrerPolicy: "no-referrer" })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); })
      .then(function (res) {
        sending = false;
        if (res.status === 200) {
          if (onSent) return onSent(item, action === "スキップ" ? "ボツで送信しました" : "送信しました", action === "スキップ");
          lockAll(action === "スキップ" ? "ボツで送信しました" : "送信しました", action === "スキップ" ? "var(--no)" : "var(--go)");
          $("status").textContent = action === "スキップ" ? "受け付けました（公開しません）。このページは閉じて大丈夫です" : "受け付けました。数分以内に反映されます。このページは閉じて大丈夫です";
        } else if (res.status === 409) {
          if (onSent) return onSent(item, "この作品はすでに判定済みでした（二重送信はされません）", false);
          lockAll("送信済みです", "#8a8a8a");
          $("status").textContent = "この作品の判定はすでに受け付けています（二重送信はされません）";
        } else if (res.status === 410 || res.status === 403) {
          if (onSent) return onSent(item, "この作品は期限切れ／更新済みのため送れませんでした。「更新」で最新の一覧を読み直します", true, true);
          lockAll(res.status === 410 ? "期限切れ" : "送信できません", "#8a8a8a");
          $("status").textContent = res.status === 410 ? "このリンクは期限切れです。新しい依頼のリンクを開いてください" : "このリンクは無効です（再送されて古くなった可能性があります）。最新のリンクを開いてください";
        } else {
          render();
          $("status").textContent = "送信に失敗しました（" + (res.body && res.body.error || res.status) + "）。もう一度押してください";
        }
      })
      .catch(function () {
        sending = false; render();
        $("status").textContent = "通信できませんでした。電波の良い所でもう一度押してください";
      });
  }

  $("send").addEventListener("click", function () {
    if (!p || !ready() || sending || sent) return;
    if (inbox) postDecision(); else location.href = mailtoHref();
  });
  $("copy").addEventListener("click", function () {
    var t = "宛先: " + p.to + "\n件名: " + p.su + "\n\n" + bodyText();
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { $("status").textContent = "コピーしました"; });
  });

  // ---------- 判定待ち一覧 (2026-11): #k=オーナー鍵&i=受け口ホスト ----------
  var key = hashParam("k");
  if (key) {
    var host = hashParam("i");
    if (!host || !/^[a-z0-9.-]+\.workers\.dev$/i.test(host) || key.length < 32) {
      fail("URL が正しくありません。通知メールの URL を開き直して、ブックマークし直してください。");
      return;
    }
    queueMode = true;
    inbox = "https://" + host;
    var items = [], cur = 0;

    function setCount() {
      $("qcount").textContent = items.length ? "判定待ち " + items.length + "件（" + (cur + 1) + "件目）" : "判定待ち 0件";
    }
    function drawList() {
      var ul = $("qlist"); clear(ul);
      items.forEach(function (it, i) {
        var li = document.createElement("li");
        if (i === cur) li.className = "cur";
        var img = document.createElement("img"); img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
        if (it.th && /^https:\/\//.test(it.th)) img.src = it.th;
        var t = document.createElement("span"); t.className = "t"; t.textContent = (it.wa && it.wa.length ? "⚠ " : "") + (it.ti || it.id);
        li.appendChild(img); li.appendChild(t);
        li.addEventListener("click", function () { open(i); $("qlist").hidden = true; });
        ul.appendChild(li);
      });
    }
    function open(i, keepToast) {
      if (!keepToast) $("toast").hidden = true;
      if (!items.length) {
        $("app").hidden = true; $("bar").hidden = true; $("qempty").hidden = false;
        setCount(); drawList(); return;
      }
      $("qempty").hidden = true;
      cur = Math.max(0, Math.min(i, items.length - 1));
      setCount(); drawList();
      showItem(items[cur]);
      $("later").hidden = items.length < 2;
      window.scrollTo(0, 0);
    }
    function toast(msg, isSkip) {
      var t = $("toast"); t.textContent = msg; t.className = "card toast" + (isSkip ? " skip" : ""); t.hidden = false;
    }
    onSent = function (item, msg, isSkip, stale) {
      var idx = items.indexOf(item);
      if (idx >= 0) items.splice(idx, 1);
      open(idx >= 0 ? idx : cur);   // 同じ位置 = 次の作品
      toast(msg + (items.length ? "　→ 次の作品です" : ""), isSkip);
      if (stale) load(true);
    };
    function load(keepToast) {
      $("qcount").textContent = "読み込み中…";
      fetch(inbox + "/v1/queue", { headers: { authorization: "Bearer " + key }, credentials: "omit", referrerPolicy: "no-referrer", cache: "no-store" })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); })
        .then(function (res) {
          if (res.status === 401) { $("queue").hidden = true; fail("鍵が正しくありません。通知メールの URL を開き直して、ブックマークし直してください。"); return; }
          if (res.status !== 200 || !res.body || !Array.isArray(res.body.items)) { $("qcount").textContent = "読み込めませんでした（" + res.status + "）。「更新」を押してください"; return; }
          var wasId = items[cur] && items[cur].id;
          items = res.body.items.filter(function (it) { return it && it.v === 1 && it.id && it.tk; });
          var at = 0;
          items.forEach(function (it, i) { if (it.id === wasId) at = i; });
          open(at, keepToast);
        })
        .catch(function () { $("qcount").textContent = "通信できませんでした。「更新」を押してください"; });
    }
    $("qtoggle").addEventListener("click", function () { $("qlist").hidden = !$("qlist").hidden; });
    $("qreload").addEventListener("click", function () { load(false); });
    $("later").addEventListener("click", function () {
      // 判定せずに後回し (この画面の中で末尾へ。何も送らない)
      if (items.length < 2 || sending) return;
      var it = items.splice(cur, 1)[0]; items.push(it);
      open(cur);
    });
    $("queue").hidden = false;
    load(false);
    return;
  }

  // ---------- 旧リンク (#d=): 1件だけ ----------
  try { p = decodePayload(); } catch (e) { p = null; }
  if (!p || p.v !== 1 || !p.id || !p.tk || !p.to || !p.su) {
    fail("リンクが正しくありません。通知メールの URL（ブックマーク）から開いてください。");
    return;
  }
  // 直接送信: 判定受け口 (p.ib) があればボタンから POST して完結 (メールアプリも差出人も関係なし)
  inbox = (typeof p.ib === "string" && /^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(p.ib)) ? p.ib : null;
  showItem(p);
})();
</script>
</body>
</html>
